[project]
name = "mathbank-exam-agent"
version = "0.1.0"
description = "Natural-language mock-exam paper generation, critic-reviewed, on the AWS Strands Agents SDK (requirements/64). OpenAI is used as the model backend for now (project-wide OPENAI_API_KEY) pending Bedrock model-access being enabled on the AWS account; swapping back to BedrockModel is a one-line change in llm_models.py."
requires-python = ">=3.11"
dependencies = [
    "strands-agents[openai]>=1.59.0",
    "boto3>=1.43",
    "httpx>=0.28",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# AWS Lambda-only (requirements/63's own pattern) — never installed into the local dev venv.
lambda = [
    "mangum>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathbank_exam_agent"]
