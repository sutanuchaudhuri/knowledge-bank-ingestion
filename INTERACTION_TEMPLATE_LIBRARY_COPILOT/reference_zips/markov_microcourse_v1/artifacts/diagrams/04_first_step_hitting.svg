<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-family="Arial" font-size="30" font-weight="bold">First-step analysis for hitting probabilities</text>
<rect x="60" y="170" width="220" height="90" rx="14" fill="#f7f7f9" stroke="#222" stroke-width="2"/>
<text x="170.0" y="222.0" text-anchor="middle" font-family="Arial" font-size="19">state i</text>
<rect x="440" y="80" width="220" height="90" rx="14" fill="#f7f7f9" stroke="#222" stroke-width="2"/>
<text x="550.0" y="120.0" text-anchor="middle" font-family="Arial" font-size="19">state j₁</text>
<text x="550.0" y="144.0" text-anchor="middle" font-family="Arial" font-size="19">value h₁</text>
<rect x="440" y="210" width="220" height="90" rx="14" fill="#f7f7f9" stroke="#222" stroke-width="2"/>
<text x="550.0" y="250.0" text-anchor="middle" font-family="Arial" font-size="19">state j₂</text>
<text x="550.0" y="274.0" text-anchor="middle" font-family="Arial" font-size="19">value h₂</text>
<rect x="440" y="340" width="220" height="90" rx="14" fill="#f7f7f9" stroke="#222" stroke-width="2"/>
<text x="550.0" y="380.0" text-anchor="middle" font-family="Arial" font-size="19">state j₃</text>
<text x="550.0" y="404.0" text-anchor="middle" font-family="Arial" font-size="19">value h₃</text>
<rect x="790" y="190" width="250" height="130" rx="14" fill="#f7f7f9" stroke="#222" stroke-width="2"/>
<text x="915.0" y="262.0" text-anchor="middle" font-family="Arial" font-size="19">hᵢ = Σ Pᵢⱼ hⱼ</text>
<line x1="280" y1="215" x2="440" y2="125" stroke="#333" stroke-width="2"/>
<polygon points="440,125 428,119 428,131" fill="#333"/>
<text x="360.0" y="162.0" text-anchor="middle" font-family="Arial" font-size="16">Pᵢ1</text>
<line x1="280" y1="215" x2="440" y2="255" stroke="#333" stroke-width="2"/>
<polygon points="440,255 428,249 428,261" fill="#333"/>
<text x="360.0" y="227.0" text-anchor="middle" font-family="Arial" font-size="16">Pᵢ2</text>
<line x1="280" y1="215" x2="440" y2="385" stroke="#333" stroke-width="2"/>
<polygon points="440,385 428,379 428,391" fill="#333"/>
<text x="360.0" y="292.0" text-anchor="middle" font-family="Arial" font-size="16">Pᵢ3</text>
<line x1="660" y1="255" x2="790" y2="255" stroke="#333" stroke-width="2"/>
<polygon points="790,255 778,249 778,261" fill="#333"/>
<text x="725.0" y="247.0" text-anchor="middle" font-family="Arial" font-size="16">weighted average</text>
</svg>