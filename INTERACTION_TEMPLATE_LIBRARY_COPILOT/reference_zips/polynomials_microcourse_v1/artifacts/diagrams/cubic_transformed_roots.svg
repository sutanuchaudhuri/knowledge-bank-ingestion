<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="50" font-family="Arial" font-size="30" font-weight="bold">Cubic transformed-root strategy</text>
<rect x="50" y="100" width="220" height="90" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="160.0" y="151.0" text-anchor="middle" font-family="Arial" font-size="20">roots a,b,c</text>
<rect x="360" y="80" width="250" height="130" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="485.0" y="151.0" text-anchor="middle" font-family="Arial" font-size="20">new roots
a+b, b+c, c+a</text>
<rect x="700" y="80" width="240" height="130" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="820.0" y="151.0" text-anchor="middle" font-family="Arial" font-size="20">compute new
e₁,e₂,e₃</text>
<rect x="700" y="300" width="240" height="90" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="820.0" y="351.0" text-anchor="middle" font-family="Arial" font-size="20">build new cubic</text>
<line x1="270" y1="145" x2="360" y2="145" stroke="#333" stroke-width="2"/>
<polygon points="360,145 348,139 348,151" fill="#333"/>
<text x="315.0" y="137.0" text-anchor="middle" font-family="Arial" font-size="16">transform</text>
<line x1="610" y1="145" x2="700" y2="145" stroke="#333" stroke-width="2"/>
<polygon points="700,145 688,139 688,151" fill="#333"/>
<text x="655.0" y="137.0" text-anchor="middle" font-family="Arial" font-size="16">Vieta</text>
<line x1="820" y1="210" x2="820" y2="300" stroke="#333" stroke-width="2"/>
<polygon points="820,300 808,294 808,306" fill="#333"/>
<text x="820.0" y="247.0" text-anchor="middle" font-family="Arial" font-size="16">x³−e₁x²+e₂x−e₃</text>
</svg>