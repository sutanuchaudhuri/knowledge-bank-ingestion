<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathBank — Socratic Studio</title><style>
:root{font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#242b35;background:#fff;--line:#e9ecf0;--muted:#7d8693;--accent:#166d58;--wash:#f5f7f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #48a58a;outline-offset:2px}.app{display:grid;grid-template-columns:60px 255px minmax(0,1fr);height:100dvh;overflow:hidden}.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:19px 0;gap:15px}.logo{font-weight:800;font-size:20px;color:white;background:var(--accent);width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:22px}.rail button{display:grid;place-items:center;width:40px;height:40px;border:0;background:none;border-radius:11px;color:#707984}.rail button:hover,.rail button.active{background:#e8f2ef;color:var(--accent)}.rail svg,.icon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sidebar{background:#fafbfc;border-right:1px solid var(--line);padding:23px 13px;overflow:auto}.sidehead{font-weight:750;font-size:15px;padding:0 9px 15px}.search{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 10px;width:100%;outline:none}.micro{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#89919b;font-weight:700;margin:26px 9px 8px}.topic{width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:10px 11px;color:#4d5865;display:flex;gap:9px;align-items:center}.topic:hover,.topic.active{background:#eaf2ef;color:#185e4d;font-weight:650}.topic small{margin-left:auto;color:#9aa2ad}.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.top{height:67px;min-height:67px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:0 27px}.crumb{color:#8b949f;font-size:13px}.top strong{font-size:14px}.spacer{flex:1}.light{background:white;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:#58616d}.light:hover{background:#f5f7f8}.primary{background:#176b57;color:white;border:1px solid #176b57;border-radius:9px;padding:9px 14px}.primary:hover{background:#0c5744}.workspace{flex:1;display:flex;min-height:0}.canvas{flex:1;min-width:0;overflow:auto;padding:34px clamp(25px,5vw,80px)}.canvas-inner{max-width:850px;margin:auto}.kicker{font-size:12px;color:#19826a;font-weight:650}.hero{font-size:29px;letter-spacing:-.035em;line-height:1.2;margin:9px 0 9px;font-weight:720}.desc{color:#89909a;margin:0 0 27px}.row{display:flex;gap:10px;align-items:center}.space{justify-content:space-between}.pill{background:#f1f5f3;color:#377d65;border-radius:99px;padding:4px 9px;font-size:11px}.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;max-width:720px;margin:0 auto}.node{display:flex;align-items:center;gap:13px;padding:15px 17px;border:1px solid #e5e9ec;border-radius:12px;background:white;text-align:left;color:#2c343d;width:100%;transition:.12s}.node:hover{border-color:#89b6a7;box-shadow:0 3px 12px #1a78540c}.node.active{border-color:#277e66;box-shadow:0 0 0 2px #eaf5f0}.node .glyph{width:36px;height:36px;border-radius:10px;background:#f0f5f3;display:grid;place-items:center;font-size:18px;flex-shrink:0}.node .name{font-weight:650}.sub{font-size:12px;color:#89919b}.arrow{text-align:center;color:#a1adb3;line-height:9px}.branch{margin:4px 0 4px 36px;padding-left:13px;border-left:2px solid #e8ebe9;display:grid;gap:7px}.branch button{background:white;border:0;text-align:left;padding:5px 8px;color:#707c85;border-radius:6px}.branch button:hover{color:#176b57;background:#eef6f2}.branch .live{color:#12664e;background:#e4f4eb;font-weight:700}.drawer{width:min(410px,43vw);border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff;flex-shrink:0;min-height:0}.drawer-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-body{overflow:auto;padding:23px 22px;flex:1}.close{background:none;border:0;color:#8b939b;font-size:20px;padding:2px 6px}.lab{display:block;color:#717b85;font-size:12px;margin:19px 0 6px;font-weight:600}input.field,textarea.field,select.field{border:1px solid #e0e5e8;border-radius:9px;padding:10px 11px;width:100%;background:#fff;color:#293039}textarea.field{min-height:80px;resize:vertical}.rule{padding:14px 0;border-bottom:1px solid var(--line)}.rule em{font-style:normal;color:#668072;font-size:12px}.rule p{margin:5px 0}.hint{padding:12px 13px;border-radius:10px;background:#f3f7f5;color:#556b62;font-size:12px;margin-top:15px}.bottom{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.seg{display:inline-flex;background:#f4f6f5;border-radius:9px;padding:3px;gap:3px}.seg button{background:none;border:0;padding:7px 12px;border-radius:7px;color:#68727b}.seg button.active{background:white;color:#176b57;box-shadow:0 1px 5px #0001}.student-box{background:#fbfcfb;border:1px solid #eaeeec;border-radius:14px;padding:24px;margin-top:20px}.answers{display:grid;gap:9px;margin:21px 0}.option{display:flex;align-items:center;gap:9px;border:1px solid #e0e6e4;border-radius:9px;padding:12px;background:white;cursor:pointer}.option:has(input:checked){border-color:#328a6d;background:#f1faf5}.result{background:#f1f8f3;border-radius:9px;padding:12px;color:#33684d;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#23352f;color:white;border-radius:10px;padding:10px 18px;box-shadow:0 12px 28px #0002;z-index:5}.chip{background:#f4f6f7;border:1px solid #e8ebed;border-radius:8px;padding:6px 9px;color:#606b75;font-size:12px}.empty{color:#89919a;padding:10px}.tiny{font-size:12px;color:#8a939b}.section-title{font-weight:700;font-size:15px;margin:22px 0 9px}.list-row{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:white;border:1px solid #eceff0;border-radius:10px;padding:14px;margin:7px 0;color:#354149}.list-row:hover{border-color:#83af9d}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:52px 190px minmax(0,1fr)}.drawer{width:min(360px,65vw)}.canvas{padding:24px}}@media(max-width:680px){.app{grid-template-columns:52px minmax(0,1fr)}.sidebar{display:none}.top{padding:0 12px;gap:6px}.crumb{display:none}.canvas{padding:22px 14px}.hero{font-size:24px}.drawer{position:absolute;z-index:3;right:0;top:67px;bottom:0;width:min(430px,calc(100vw - 52px));box-shadow:-15px 0 30px #0001}}
</style></head><body><div class="app"><nav class="rail" aria-label="Main"><div class="logo">M</div><button class="active" data-view="flow" title="Workflow designer" aria-label="Workflow designer">◈</button><button data-view="topics" title="Rules by topic" aria-label="Rules by topic">⌗</button><button data-view="library" title="Templates" aria-label="Templates">▦</button><button data-view="student" title="Student simulator" aria-label="Student simulator">♙</button><div class="spacer"></div><button id="reset" title="Reset demo" aria-label="Reset demo">↺</button></nav><aside class="sidebar"><div class="sidehead">Socratic Studio</div><input id="search" class="search" placeholder="Search topics…" aria-label="Search topics"><div class="micro">Workspaces</div><div id="topics"></div><div class="micro">Quick actions</div><button class="topic" id="newflow">＋ New workflow</button><button class="topic" id="export">⇩ Export draft JSON</button></aside><main class="main"><header class="top"><span class="crumb">MathBank / Socratic Studio /</span><strong id="topname">Stars and Bars</strong><div class="spacer"></div><span class="pill" id="draftBadge">Draft · local</span><button class="light" id="viewStudent">♙ &nbsp; Student view</button><button class="primary" id="aiTop">✦ &nbsp; Ask AI</button></header><section class="workspace"><div class="canvas" id="canvas"></div><aside class="drawer hidden" id="drawer"><div class="drawer-head"><strong id="drawerTitle">Details</strong><button class="close" id="closeDrawer" title="Close pane">×</button></div><div class="drawer-body" id="drawerBody"></div><div class="bottom" id="drawerBottom"></div></aside></section></main></div><script>
const defaults={topic:'Stars and Bars',nodes:[{id:'discover',type:'discovery',title:'Discover the representation',detail:'How can identical objects be distributed among labeled boxes?',prompt:'Five identical stars must be placed in three labeled boxes. What do the two separators represent?'},{id:'quiz',type:'quiz',title:'Check the justification',detail:'Assertion–Reason · 1 question',prompt:'Assertion: x + y + z = 5 has 21 nonnegative integer solutions. Reason: each solution corresponds uniquely to arranging five identical stars and two separators.',options:['Both are true, and the reason explains the assertion','Both true, but the reason does not explain it','Assertion true, reason false','Assertion false, reason true','Both false'],correct:0},{id:'lesson',type:'lesson',title:'Bijections mini-lesson',detail:'Targeted support · 2 min',prompt:'Each row of five stars and two separators describes one triple. Why does every triple correspond to exactly one arrangement?'},{id:'retry',type:'quiz',title:'Simpler counting checkpoint',detail:'Single-choice',prompt:'How many nonnegative solutions are there to a + b = 3?',options:['2','3','4','6'],correct:2},{id:'advance',type:'discovery',title:'Generalize the pattern',detail:'Transfer to n objects and k boxes',prompt:'If there are n identical stars and k labeled boxes, how many separators do we need?'}],rules:[{id:'r1',from:'quiz',condition:'answer_correct',to:'advance',text:'When the student justifies the counting argument correctly, advance to generalization.',priority:1},{id:'r2',from:'quiz',condition:'answer_incorrect',to:'lesson',text:'If the student cannot justify the counting argument, show the Bijections mini-lesson.',priority:2},{id:'r3',from:'lesson',condition:'complete',to:'retry',text:'After the mini-lesson, check understanding using a simpler counting question.',priority:1},{id:'r4',from:'retry',condition:'answer_correct',to:'advance',text:'If the simpler counting question is correct, return to the main discovery.',priority:1},{id:'r5',from:'retry',condition:'answer_incorrect',to:'lesson',text:'If the simpler counting question is incorrect, revisit the Bijections mini-lesson.',priority:2},{id:'r6',from:'discover',condition:'complete',to:'quiz',text:'After exploring the representation, begin the justification checkpoint.',priority:1}]};
const templates={'Stars and Bars':defaults,'Inclusion–Exclusion':{topic:'Inclusion–Exclusion',nodes:[{id:'discover',type:'discovery',title:'Discover the double-counting',detail:'Observe overlapping sets',prompt:'When two overlapping sets are counted separately, what happens to objects in their intersection?'},{id:'quiz',type:'quiz',title:'Intersection checkpoint',detail:'Single-choice',prompt:'If |A| = 6, |B| = 5, and |A ∩ B| = 2, what is |A ∪ B|?',options:['11','9','13','3'],correct:1},{id:'lesson',type:'lesson',title:'Visual overlap lesson',detail:'Remediation',prompt:'Color the intersection twice. Why must we remove one copy?'},{id:'advance',type:'discovery',title:'Extend to three sets',detail:'Generalization',prompt:'Why do triple intersections reappear in inclusion–exclusion?'}],rules:[{id:'r1',from:'discover',condition:'complete',to:'quiz',text:'After exploring overlap, check understanding.',priority:1},{id:'r2',from:'quiz',condition:'answer_correct',to:'advance',text:'If correct, generalize to three sets.',priority:1},{id:'r3',from:'quiz',condition:'answer_incorrect',to:'lesson',text:'If incorrect, revisit the overlapping regions.',priority:2},{id:'r4',from:'lesson',condition:'complete',to:'quiz',text:'After explanation, retry the checkpoint.',priority:1}]}};
const domainTopics={'Combinatorics':['Stars and Bars','Inclusion–Exclusion','Graph Theory','Double Counting'],'Geometry':['Loci','Constructions','Inversion'],'Algebra':['Vieta','Inequalities','Functional Equations'],'Probability':['Conditional Probability','Expectation'],'Number Theory':['Modular Arithmetic','Diophantine Equations'],'Complex Numbers':['Roots of Unity'],'Solid Geometry':['Cross-sections'],'Arithmetic':['Ratio Reasoning']};
let data=load(),view='flow',selected='quiz',drawer='',studentNode='discover',selectedAnswer=-1,highlight='',lastFeedback='',aiDraft=null;
function load(){try{let p=JSON.parse(localStorage.getItem('mathbankStudioV4'));return p&&p.nodes&&p.rules?p:structuredClone(defaults)}catch{return structuredClone(defaults)}}function save(){localStorage.setItem('mathbankStudioV4',JSON.stringify(data));document.getElementById('draftBadge').textContent='Draft · saved locally'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function node(id){return data.nodes.find(x=>x.id===id)}function iconFor(x){return ({discovery:'◇',quiz:'▤',lesson:'▣',topic:'⌘',decision:'⑂'})[x]||'◇'}function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2500)}function renderTopics(){let filter=document.getElementById('search').value.toLowerCase();document.getElementById('topics').innerHTML=Object.entries(domainTopics).map(([domain,topics])=>{let matches=topics.filter(t=>!filter||t.toLowerCase().includes(filter)||domain.toLowerCase().includes(filter));return matches.length?`<div class="micro" style="margin-top:14px">${domain}</div>`+matches.map(t=>`<button class="topic ${data.topic===t?'active':''}" data-topic="${esc(t)}"><span>◦</span>${esc(t)}${data.topic===t?'<small>●</small>':''}</button>`).join(''):''}).join('');document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>switchTopic(b.dataset.topic))}function switchTopic(t){if(templates[t])data=structuredClone(templates[t]);else{data=structuredClone(defaults);data.topic=t;data.nodes[0].title='Explore '+t;data.nodes[0].prompt='What do you notice about the key mathematical relationships in '+t+'?';data.nodes[1].title='Reasoning checkpoint';data.nodes[1].prompt='Which explanation best supports your conjecture about '+t+'?';data.nodes[1].options=['A valid justification','An incomplete justification','An unrelated justification','An invalid conclusion'];data.nodes[1].correct=0;}studentNode='discover';highlight='';selected='discover';save();render()}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('topname').textContent=data.topic;renderTopics();const c=document.getElementById('canvas');if(view==='flow')renderFlow(c);else if(view==='student')renderStudentCanvas(c);else if(view==='topics')renderRules(c);else renderLibrary(c);renderDrawer()}
function renderFlow(c){let by=data.nodes;c.innerHTML=`<div class="canvas-inner"><div class="row space"><div><div class="kicker">DESIGNER</div><h1 class="hero">${esc(data.topic)}</h1><p class="desc">Choose a step to edit. Open student view to experience the branch.</p></div><button class="light" id="addNode">＋ Add step</button></div><div class="flow">${by.map((n,i)=>`${i?'<div class="arrow">↓</div>':''}<button class="node ${selected===n.id?'active':''}" data-node="${esc(n.id)}"><span class="glyph">${iconFor(n.type)}</span><span style="flex:1"><span class="name">${esc(n.title)}</span><br><span class="sub">${esc(n.detail)}</span></span><span class="tiny">Edit ›</span></button>${data.rules.filter(r=>r.from===n.id).length>1?`<div class="branch">${data.rules.filter(r=>r.from===n.id).map(r=>`<button class="${highlight===r.id?'live':''}" data-rule="${r.id}">↳ ${esc(r.text)} ${highlight===r.id?'✓':''}</button>`).join('')}</div>`:''}`).join('')}</div><div class="hint" style="max-width:720px;margin:24px auto">Click a step for settings, or click a branch for its plain-English rule. This is a focused authoring view—other controls stay out of the way until needed.</div></div>`;c.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=b.dataset.node;drawer='node';render()});c.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{selected=b.dataset.rule;drawer='rule';render()});c.querySelector('#addNode').onclick=()=>{drawer='add';renderDrawer()}}
function renderRules(c){c.innerHTML=`<div class="canvas-inner"><div class="kicker">POLICY LIBRARY</div><h1 class="hero">Rules by topic</h1><p class="desc">Readable policies first. Technical conditions appear only when a rule is opened.</p>${data.rules.map(r=>`<button class="list-row" data-rule="${r.id}"><span><b>${esc(node(r.from)?.title||r.from)}</b><br><span class="sub">${esc(r.text)}</span></span><span class="tiny">Edit ›</span></button>`).join('')}<button class="light" id="newRule">＋ Describe a new rule in English</button></div>`;c.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{selected=b.dataset.rule;drawer='rule';renderDrawer()});c.querySelector('#newRule').onclick=()=>{drawer='ai';renderDrawer()}}
function renderLibrary(c){c.innerHTML=`<div class="canvas-inner"><div class="kicker">TEMPLATES</div><h1 class="hero">Start with a teaching strategy</h1><p class="desc">Reuse a domain-specific journey, then refine its questions and branches.</p>${Object.entries(domainTopics).map(([d,tt])=>`<div class="section-title">${d}</div>${tt.map(t=>`<button class="list-row" data-topic2="${esc(t)}"><span>${esc(t)}<br><span class="sub">${t==='Stars and Bars'||t==='Inclusion–Exclusion'?'Worked sample · branching quiz':'Starter scaffold · review before use'}</span></span><span>Use template ›</span></button>`).join('')}`).join('')}</div>`;c.querySelectorAll('[data-topic2]').forEach(b=>b.onclick=()=>{switchTopic(b.dataset.topic2);view='flow';render()})}
function nextFrom(id,outcome){return data.rules.filter(r=>r.from===id&&r.condition===outcome).sort((a,b)=>a.priority-b.priority)[0]||null}function advance(outcome){let r=nextFrom(studentNode,outcome);if(r){highlight=r.id;studentNode=r.to;selected=r.to;selectedAnswer=-1;lastFeedback='';render();toast('Matched rule: '+r.text)}else{lastFeedback='No matching transition. The journey pauses here.';render()}}
function renderStudentCanvas(c){const n=node(studentNode);c.innerHTML=`<div class="canvas-inner" style="max-width:680px"><div class="row space"><div><div class="kicker">STUDENT SIMULATION</div><h1 class="hero">${esc(n?.title||'Lesson complete')}</h1><p class="desc">${esc(data.topic)} · Demo student · This does not alter real student progress.</p></div><button class="light" id="restart">↺ Restart</button></div><div class="student-box"><div class="pill" style="display:inline-block">${esc(n?.type||'done')}</div><h2 style="font-size:19px;line-height:1.45;font-weight:650">${esc(n?.prompt||'No additional activity is configured.')}</h2>${n?.type==='quiz'?`<div class="answers">${(n.options||[]).map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${selectedAnswer===i?'checked':''}> ${esc(o)}</label>`).join('')}</div><button class="primary" id="submitAnswer" ${selectedAnswer<0?'disabled':''}>Submit answer →</button>`:`<textarea class="field" id="studentWork" placeholder="Think through the question here (optional in this prototype)…" style="min-height:110px"></textarea><div style="height:13px"></div><button class="primary" id="completeStep">${n?.type==='lesson'?'Finish mini-lesson':'Continue'} →</button>`}${lastFeedback?`<div class="result">${esc(lastFeedback)}</div>`:''}</div><div class="hint">Tip: keep the editor open on the right. Submissions highlight the branch selected by the rules.</div></div>`;c.querySelector('#restart').onclick=()=>{studentNode=data.nodes[0].id;selectedAnswer=-1;highlight='';lastFeedback='';render()};c.querySelectorAll('input[name=answer]').forEach(b=>b.onchange=()=>{selectedAnswer=Number(b.value);renderStudentCanvas(c)});c.querySelector('#submitAnswer')?.addEventListener('click',()=>{let correct=selectedAnswer===n.correct;advance(correct?'answer_correct':'answer_incorrect')});c.querySelector('#completeStep')?.addEventListener('click',()=>advance('complete'))}
function renderDrawer(){const d=document.getElementById('drawer'),b=document.getElementById('drawerBody'),foot=document.getElementById('drawerBottom');d.classList.toggle('hidden',!drawer);if(!drawer)return;foot.innerHTML='';const title=document.getElementById('drawerTitle');if(drawer==='node'){let n=node(selected);if(!n){drawer='';renderDrawer();return}title.textContent='Edit step';b.innerHTML=`<div class="kicker">${esc(n.type.toUpperCase())}</div><label class="lab">Step title</label><input class="field" id="nodeTitle" value="${esc(n.title)}"><label class="lab">Student-facing question or content</label><textarea class="field" id="nodePrompt" style="min-height:135px">${esc(n.prompt)}</textarea><label class="lab">Activity type</label><select class="field" id="nodeType">${['discovery','quiz','lesson','topic'].map(t=>`<option ${n.type===t?'selected':''} value="${t}">${t}</option>`).join('')}</select><div class="section-title">Connections</div>${data.rules.filter(r=>r.from===n.id).map(r=>`<button class="list-row" data-rr="${r.id}"><span class="sub">${esc(r.text)}</span><span>›</span></button>`).join('')||'<p class="sub">No outgoing rules yet.</p>'}<button class="light" id="addFrom" style="margin-top:12px">＋ Add branching rule</button>`;foot.innerHTML='<button class="light" id="previewNode">Preview as student</button><button class="primary" id="saveNode">Save changes</button>';foot.querySelector('#saveNode').onclick=()=>{n.title=b.querySelector('#nodeTitle').value;n.prompt=b.querySelector('#nodePrompt').value;n.type=b.querySelector('#nodeType').value;save();toast('Draft saved');render()};foot.querySelector('#previewNode').onclick=()=>{studentNode=n.id;selectedAnswer=-1;view='student';render()};b.querySelectorAll('[data-rr]').forEach(x=>x.onclick=()=>{selected=x.dataset.rr;drawer='rule';renderDrawer()});b.querySelector('#addFrom').onclick=()=>{window.ruleOrigin=n.id;drawer='ai';renderDrawer()}}
else if(drawer==='rule'){let r=data.rules.find(x=>x.id===selected);if(!r){drawer='';renderDrawer();return}title.textContent='Edit routing rule';b.innerHTML=`<div class="kicker">PLAIN LANGUAGE</div><label class="lab">Describe what should happen</label><textarea class="field" id="ruleText" style="min-height:118px">${esc(r.text)}</textarea><div class="hint">The annotation explains the rule to instructors. The structured condition below determines behavior. Changing the annotation alone does not change execution.</div><label class="lab">When student is at</label><select class="field" id="ruleFrom">${data.nodes.map(n=>`<option value="${n.id}" ${r.from===n.id?'selected':''}>${esc(n.title)}</option>`).join('')}</select><label class="lab">Condition</label><select class="field" id="ruleCondition">${[['complete','Activity completed'],['answer_correct','Answer is correct'],['answer_incorrect','Answer is incorrect']].map(([v,t])=>`<option value="${v}" ${r.condition===v?'selected':''}>${t}</option>`).join('')}</select><label class="lab">Then open</label><select class="field" id="ruleTo">${data.nodes.map(n=>`<option value="${n.id}" ${r.to===n.id?'selected':''}>${esc(n.title)}</option>`).join('')}</select><label class="lab">Priority</label><input type="number" min="1" class="field" id="rulePriority" value="${r.priority}"><div class="hint">If two rules have the same condition, the smallest priority number runs first. For production, conflicting conditions require explicit validation.</div>`;foot.innerHTML='<button class="light" id="removeRule">Remove</button><button class="primary" id="saveRule">Save rule</button>';foot.querySelector('#saveRule').onclick=()=>{Object.assign(r,{text:b.querySelector('#ruleText').value,from:b.querySelector('#ruleFrom').value,condition:b.querySelector('#ruleCondition').value,to:b.querySelector('#ruleTo').value,priority:Math.max(1,Number(b.querySelector('#rulePriority').value)||1)});save();toast('Rule saved');render()};foot.querySelector('#removeRule').onclick=()=>{data.rules=data.rules.filter(x=>x!==r);drawer='';save();render()}}
else if(drawer==='ai'){title.textContent='Create with AI';b.innerHTML=`<div class="kicker">NATURAL-LANGUAGE AUTHORING</div><h2 style="font-size:21px;margin:8px 0">Describe a rule</h2><p class="desc">Write a plain-English instruction. The demo proposes a structured draft for your review.</p><textarea class="field" id="nl" style="min-height:125px" placeholder="If a student answers incorrectly in the justification quiz, send them to the Bijections mini-lesson."></textarea><button class="primary" id="propose" style="margin-top:12px">✦ Propose rule</button><div id="proposal"></div><div class="hint">Illustrative local interpreter only. Real Bedrock proposals must be validated against approved destinations and explicitly accepted by an instructor.</div>`;b.querySelector('#propose').onclick=()=>{let t=b.querySelector('#nl').value.trim();if(!t)return toast('Describe a rule first');let from=window.ruleOrigin&&node(window.ruleOrigin)?window.ruleOrigin:/simpler|counting checkpoint/i.test(t)?'retry':/lesson/i.test(t)?'lesson':'quiz';let to=/foundation|topic/i.test(t)?'lesson':/retry|try again/i.test(t)?'retry':/general|advance|next/i.test(t)?'advance':'lesson';if(!node(from))from=data.nodes[0].id;if(!node(to))to=data.nodes[0].id;let condition=/incorrect|wrong|struggle|fail/i.test(t)?'answer_incorrect':/correct|success|right/i.test(t)?'answer_correct':'complete';if(condition==='answer_incorrect'&&node(from).type!=='quiz'){from='quiz'}aiDraft={id:'r'+Date.now(),from,to,condition,text:t,priority:9};b.querySelector('#proposal').innerHTML=`<div class="student-box" style="padding:15px"><b>Proposed rule</b><p class="sub">From: ${esc(node(from)?.title)}</p><p class="sub">When: ${esc(condition.replace('_',' '))}</p><p class="sub">Then: ${esc(node(to)?.title)}</p><button class="primary" id="accept">Add to draft</button> <button class="light" id="cancel">Discard</button></div>`;b.querySelector('#accept').onclick=()=>{data.rules.push(aiDraft);window.ruleOrigin=null;save();drawer='';toast('Proposed rule added to draft');render()};b.querySelector('#cancel').onclick=()=>b.querySelector('#proposal').innerHTML=''}}
else if(drawer==='add'){title.textContent='Add activity';b.innerHTML=`<h2>New step</h2><label class="lab">Step title</label><input class="field" id="nt" value="New discovery"><label class="lab">Type</label><select class="field" id="typ"><option value="discovery">Discovery</option><option value="quiz">Quiz</option><option value="lesson">Lesson</option><option value="topic">Topic</option></select><label class="lab">Student-facing prompt</label><textarea class="field" id="pr">What can you infer from this example?</textarea>`;foot.innerHTML='<button class="primary" id="doAdd">Create step</button>';foot.querySelector('#doAdd').onclick=()=>{let id='node'+Date.now();data.nodes.push({id,type:b.querySelector('#typ').value,title:b.querySelector('#nt').value,prompt:b.querySelector('#pr').value,detail:'New draft activity'});selected=id;drawer='node';save();render()}}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;drawer='';render()});document.getElementById('search').oninput=renderTopics;document.getElementById('closeDrawer').onclick=()=>{drawer='';renderDrawer()};document.getElementById('viewStudent').onclick=()=>{view=view==='student'?'flow':'student';render()};document.getElementById('aiTop').onclick=()=>{drawer='ai';renderDrawer()};document.getElementById('newflow').onclick=()=>{data=structuredClone(defaults);data.topic='New Math Topic';studentNode='discover';save();render();toast('New draft created')};document.getElementById('reset').onclick=()=>{if(confirm('Reset to the Stars and Bars demo?')){localStorage.removeItem('mathbankStudioV4');data=structuredClone(defaults);studentNode='discover';selected='quiz';highlight='';drawer='';render()}};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='mathbank-socratic-workflow.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),800)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer='';renderDrawer()}});render();
</script></body></html>
