<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathBank Socratic Studio — Rules & Live Preview</title><style>
:root{font:14px Inter,ui-sans-serif,system-ui,sans-serif;color:#23324b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #d5deec;border-radius:9px;padding:9px 12px;color:#273b5d}button:hover{border-color:#718bec}button:disabled{opacity:.4;cursor:default}button.primary{background:#425fe5;color:white;border-color:#425fe5}button.soft{background:#eef2ff;color:#364fc0}button.danger{color:#ae3353}input,select,textarea{width:100%;padding:10px;border:1px solid #d8e0ec;border-radius:9px;background:white;color:#20304a}textarea{resize:vertical;min-height:84px}label{display:block;font-size:12px;font-weight:700;color:#596d89;margin:12px 0 6px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh}.side{background:#152540;padding:22px 12px;color:white;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:800;padding:5px 12px 24px}.brand span{color:#9fb4ff}.side button{border:0;background:none;color:#bdc9dd;text-align:left;width:100%;margin:2px 0;padding:12px}.side button.active,.side button:hover{background:#2c4060;color:white}.side small{margin-top:auto;padding:12px;color:#8ea1bd;line-height:1.6}.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}.top{padding:16px 23px;background:white;border-bottom:1px solid #e0e7f0;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:19px;margin:0}.muted{color:#72839e;font-size:12px}.content{overflow:auto;padding:20px 22px;flex:1}.card{background:white;border:1px solid #e1e7f1;border-radius:15px;padding:17px;box-shadow:0 2px 12px #22334e08}.stack>*+*{margin-top:13px}.h{margin:0 0 7px;font-size:21px}.chip{display:inline-block;border-radius:100px;background:#eaf0ff;color:#405cc2;padding:4px 9px;font-size:11px;font-weight:700}.chip.green{background:#e8f7ee;color:#20764d}.chip.gold{background:#fff3d9;color:#966d0b}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.split{display:grid;grid-template-columns:minmax(340px,1.03fr) minmax(340px,.97fr);gap:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pillbar{display:flex;gap:6px;flex-wrap:wrap}.pillbar button.on{background:#e8edff;color:#304ab9;border-color:#9aacef}.flow{padding:16px;background:radial-gradient(#dce4f0 1px,transparent 1px);background-size:15px 15px;border-radius:12px}.node{background:white;border:1px solid #dbe3ef;border-radius:10px;padding:12px;cursor:pointer;text-align:left;width:100%;margin:4px 0}.node.selected{border:2px solid #5573eb;background:#f1f5ff}.node.current{box-shadow:0 0 0 3px #b8eacb}.branch{font-size:12px;color:#6980a2;margin-left:14px;padding:4px 12px;border-left:2px solid #c7d5e8}.branch.hit{border-left:4px solid #2c9e6b;background:#eaf9f0;color:#167044;font-weight:700}.rule{background:#f9fbff;border:1px solid #e2e9f5;border-radius:12px;padding:13px;margin-top:10px}.rule.hit{border-color:#4caf7a;background:#ecfbf2}.explain{font-size:13px;line-height:1.55;margin:8px 0 2px}.dim{color:#7b89a1;font-size:12px}.note{background:#f0f4ff;border-radius:10px;padding:11px;line-height:1.55}.preview{min-height:340px}.answers button{display:block;width:100%;text-align:left;margin:7px 0;padding:12px}.answers .selected{background:#eaf0ff;border-color:#5771e3}.feedback{padding:12px;background:#eef8f1;border-radius:10px;margin-top:12px}.path{padding:10px 12px;background:#f5f8fc;border:1px solid #e2e8f2;border-radius:10px;margin:7px 0;font-size:12px}.status{margin:12px 0;border-top:1px solid #edf0f5;padding-top:12px}.debug{background:#17243a;color:#d9e5f9;padding:11px;border-radius:9px;white-space:pre-wrap;font-size:12px;line-height:1.5}.drawer{background:#fafcff;border:1px solid #e4eaf5;padding:12px;border-radius:11px}.gridCards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.catalogEntry{padding:13px;border:1px solid #e1e7f1;border-radius:12px;margin:8px 0}.alert{color:#975723;background:#fff7e6;padding:10px;border-radius:9px}.sm{font-size:12px}.sectionline{border-top:1px solid #e4eaf1;margin:15px 0}.smallbutton{padding:6px 10px;font-size:12px}@media(max-width:1120px){.shell{grid-template-columns:75px 1fr}.side{padding:10px 5px}.brand{font-size:12px;padding:8px 3px}.side button{font-size:11px}.split{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block;height:auto}.side{flex-direction:row;overflow:auto}.side button{white-space:nowrap}.side small{display:none}.top{padding:12px}.content{padding:12px}.two,.gridCards{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const resources=[{id:'start',type:'DISCOVERY',title:'Discover the representation',topic:'Stars and Bars',prompt:'Five identical objects are distributed among three labeled boxes. Why might two separators describe every distribution?'},{id:'quiz',type:'QUIZ',title:'Stars and Bars · Assertion–Reason',topic:'Stars and Bars',prompt:'Assertion: The number of nonnegative solutions of x + y + z = 5 is 21. Reason: Each solution corresponds uniquely to an arrangement of five stars and two separators.',options:['Both true; reason explains assertion','Both true; reason does not explain assertion','Assertion true; reason false','Assertion false; reason true','Both false'],correct:0},{id:'lesson',type:'LESSON',title:'Bijections mini-lesson',topic:'Bijections',prompt:'Write each distribution as a string of five stars and two bars. Why can no two different distributions produce the same string?'},{id:'easy',type:'QUIZ',title:'Small counting checkpoint',topic:'Counting',prompt:'How many pairs of nonnegative integers (x, y) satisfy x + y = 3?',options:['3','4','5','6'],correct:1},{id:'topic',type:'TOPIC',title:'Counting Foundations',topic:'Counting',prompt:'Explore the solutions to a+b=2. Try listing all possibilities in an orderly way.'},{id:'finish',type:'TRANSFER',title:'Generalize the principle',topic:'Stars and Bars',prompt:'Write a formula for the number of nonnegative integer solutions to x₁+⋯+xₖ=n. Explain why it works.'},{id:'pie',type:'LESSON',title:'Introduction to Inclusion–Exclusion',topic:'Inclusion–Exclusion',prompt:'When upper bounds are placed on the boxes, which cases must be excluded from the unrestricted count?'},{id:'geometry',type:'TOPIC',title:'Loci and geometric constraints',topic:'Geometry / Loci',prompt:'Where are all points equidistant from two fixed points?'}];
const initial=[{id:'r1',from:'start',condition:'completed',to:'quiz',annotation:'After the student has explored the representation, move to the Assertion–Reason quiz.'},{id:'r2',from:'quiz',condition:'correct',to:'finish',annotation:'If the student correctly identifies the assertion, reason, and their logical connection, advance to generalization.'},{id:'r3',from:'quiz',condition:'incorrect',to:'lesson',annotation:'If the student has not justified the counting relationship, open a short lesson about bijections.'},{id:'r4',from:'lesson',condition:'completed',to:'easy',annotation:'After the bijection explanation, check understanding with a simpler counting question.'},{id:'r5',from:'easy',condition:'correct',to:'finish',annotation:'If the simpler checkpoint is correct, return to the main journey and generalize.'},{id:'r6',from:'easy',condition:'incorrect',to:'topic',annotation:'If the simpler checkpoint is incorrect, revisit Counting Foundations.'},{id:'r7',from:'topic',condition:'completed',to:'easy',annotation:'After reviewing Counting Foundations, retry the simpler checkpoint.'}];
let state={page:'workspace',node:'quiz',student:'start',rules:initial,selectedAnswer:null,response:'',feedback:'',trace:[],hit:null,draft:'',proposal:null,nl:'If the student gets the Assertion–Reason quiz wrong, send them to the Bijections mini-lesson.',editing:null,ruleTopic:'All topics',studentMode:'Preview',attempts:{},hint:false};
const resource=id=>resources.find(r=>r.id===id),title=id=>resource(id)?.title||id;const SAVE='mathbank-socratic-v3-rules';try{let x=JSON.parse(localStorage.getItem(SAVE)||'null');if(Array.isArray(x)&&x.length)state.rules=x}catch{}function save(){localStorage.setItem(SAVE,JSON.stringify(state.rules))}function setPage(p){state.page=p;render()}function chooseNode(id){state.node=id;state.student=id;state.selectedAnswer=null;state.response='';state.feedback='';state.hit=null;state.hint=false;render()}function studentReset(){state.student='start';state.trace=[];state.hit=null;state.feedback='';state.selectedAnswer=null;state.response='';state.attempts={};state.hint=false;render()}
function human(r){return r.annotation||`When ${title(r.from)} is ${r.condition}, take the student to ${title(r.to)}.`}function conditionText(c){return {correct:'answers correctly',incorrect:'answers incorrectly',completed:'completes the activity',always:'reaches this step'}[c]||c}
function candidateFromNL(txt){let lower=txt.toLowerCase();let from= lower.includes('simpler')||lower.includes('checkpoint')?'easy':lower.includes('representation')?'start':lower.includes('mini-lesson')?'lesson':'quiz';let to= lower.includes('inclusion')||lower.includes('pie')?'pie':lower.includes('counting foundations')?'topic':lower.includes('counting quiz')||lower.includes('simpler quiz')?'easy':lower.includes('generaliz')||lower.includes('advance')?'finish':lower.includes('geometry')||lower.includes('loci')?'geometry':'lesson';let condition= /wrong|incorrect|fails|struggl|not correct/.test(lower)?'incorrect':/correct|passes|succeed/.test(lower)?'correct':/complete|after|finish/.test(lower)?'completed':'completed';if(/mini-lesson|bijection lesson/.test(lower)&&/after|complete/.test(lower))from='lesson';if(/mini-lesson|bijection lesson/.test(lower)&&!/after|complete/.test(lower))to='lesson';return {id:'r'+Date.now(),from,condition,to,annotation:txt.trim()}}
function propose(){const text=state.nl.trim();if(!text){alert('Describe the rule in ordinary language.');return}state.proposal=candidateFromNL(text);render()}function acceptProposal(){if(!state.proposal)return;state.rules.push(state.proposal);state.node=state.proposal.from;state.proposal=null;save();render()}function setRule(id,key,value){let r=state.rules.find(r=>r.id===id);if(r){r[key]=value;save();render()}}function deleteRule(id){state.rules=state.rules.filter(r=>r.id!==id);save();render()}function resetRules(){state.rules=structuredClone(initial);save();state.hit=null;render()}
function submit(){const n=resource(state.student);if(!n)return;let outcome='completed';if(n.type==='QUIZ'){if(state.selectedAnswer===null){state.feedback='Choose an answer before submitting.';render();return}outcome=state.selectedAnswer===n.correct?'correct':'incorrect';state.feedback=outcome==='correct'?'Your answer is correct. The permitted branch will now be highlighted.':'This answer does not satisfy the approved solution key. The workflow chooses a supported next step.'}else if(n.type==='TRANSFER'){state.feedback='Journey complete (simulation). Your explanation is not automatically certified by this local demo.';render();return}else if(!state.response.trim()){state.feedback='Write a brief observation or response before continuing.';render();return}else{state.feedback='Your response was recorded in this demonstration. In production, free-form grading requires the approved evaluator.'}state.attempts[n.id]=(state.attempts[n.id]||0)+1;let matching=state.rules.filter(r=>r.from===n.id&&(r.condition===outcome||r.condition==='always')).sort((a,b)=>a.condition==='always'?1:-1);let chosen=matching[0];state.hit=chosen?.id||null;state.trace.push({from:n.id,outcome,to:chosen?.to||null,rule:chosen?.id||null});if(chosen){state.student=chosen.to;state.node=chosen.from;state.selectedAnswer=null;state.response='';state.hint=false}render()}
function nav(){return [['workspace','◈ Designer + Simulator'],['rules','☷ Rules by topic'],['library','▦ Resource library']].map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="setPage('${p}')">${t}</button>`).join('')}
function flow(){const n=resource(state.node);return `<div class="card stack"><div class="row between"><strong>Workflow map</strong><span class="chip">Select any node</span></div><div class="flow">${resources.map(r=>`<button class="node ${state.node===r.id?'selected':''} ${state.student===r.id?'current':''}" onclick="chooseNode('${r.id}')"><span class="muted">${esc(r.type)} · ${esc(r.topic)}</span><br><strong>${esc(r.title)}</strong></button>${state.rules.filter(x=>x.from===r.id).map(x=>`<div class="branch ${state.hit===x.id?'hit':''}">${state.hit===x.id?'✓ Selected: ':''}${esc(conditionText(x.condition))} → ${esc(title(x.to))}</div>`).join('')}`).join('')}</div><span class="muted">Blue outline = editing selection; green outline = active student screen; green branch = route taken.</span></div>`}
function student(){let n=resource(state.student);if(!n)return '';return `<div class="card preview stack"><div class="row between"><div><strong>Student Simulator</strong><div class="muted">Preview identity · Synthetic session · No mastery write</div></div><span class="chip green">Log in as student · Demo</span></div><div class="row between"><span class="chip">${esc(n.type)}</span><button class="smallbutton" onclick="studentReset()">Restart student</button></div><h2 class="h">${esc(n.title)}</h2><div class="note">${esc(n.prompt)}</div>${n.options?`<div class="answers">${n.options.map((x,i)=>`<button class="${state.selectedAnswer===i?'selected':''}" onclick="state.selectedAnswer=${i};state.feedback='';render()">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}</div>`:`<label for="answer">Your thinking</label><textarea id="answer" oninput="state.response=this.value" placeholder="Describe an observation or justification…">${esc(state.response)}</textarea>`}<div class="row"><button class="primary" onclick="submit()">${n.type==='QUIZ'?'Submit answer':'Continue'}</button><button onclick="state.hint=!state.hint;render()">${state.hint?'Hide hint':'Request hint'}</button></div>${state.hint?`<div class="note">${n.type==='QUIZ'?'Consider whether the mapping is one-to-one and accounts for every distribution.':'Try a smaller example and explain the pattern you notice.'}</div>`:''}${state.feedback?`<div class="feedback">${esc(state.feedback)}</div>`:''}<div class="status"><strong>Student journey</strong>${state.trace.length?state.trace.map(e=>`<div class="path">${esc(title(e.from))} — <strong>${esc(e.outcome)}</strong> → ${esc(e.to?title(e.to):'No matching route')} ${e.rule?'('+esc(e.rule)+')':''}</div>`).join(''):'<p class="muted">Submit an answer to see which admin rule is activated.</p>'}</div><div class="muted">In the real app, scoring, authorization and transition selection will run through MathBank REST and approved workflow releases.</div></div>`}
function ruleCard(r){return `<div class="rule ${state.hit===r.id?'hit':''}"><div class="row between"><strong>${esc(title(r.from))}</strong><span class="chip">${esc(resource(r.from)?.topic)}</span></div><div class="explain">${esc(human(r))}</div><div class="dim">Structured rule: when <code>${esc(r.condition)}</code> → <code>${esc(r.to)}</code></div><div class="two"><div><label>When the student…</label><select onchange="setRule('${r.id}','condition',this.value)">${['correct','incorrect','completed','always'].map(x=>`<option value="${x}" ${r.condition===x?'selected':''}>${esc(conditionText(x))}</option>`).join('')}</select></div><div><label>Send student to…</label><select onchange="setRule('${r.id}','to',this.value)">${resources.filter(x=>x.id!==r.from).map(x=>`<option value="${x.id}" ${r.to===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div></div><label>Plain-language explanation (editable)</label><textarea onchange="setRule('${r.id}','annotation',this.value)">${esc(r.annotation)}</textarea><div class="row between"><button class="smallbutton" onclick="chooseNode('${r.from}');setPage('workspace')">Test this rule ↗</button><button class="smallbutton danger" onclick="deleteRule('${r.id}')">Delete</button></div></div>`}
function natural(){return `<div class="card stack"><div class="row between"><strong>✦ Create a rule in natural language</strong><span class="chip gold">Review before apply</span></div><p class="muted">Write what an instructor wants to happen. This offline demonstration parses common phrasing; a production AI service must return typed, validated proposed changes.</p><textarea id="nl" oninput="state.nl=this.value" placeholder="If a student gets the quiz wrong, send them to Bijections…">${esc(state.nl)}</textarea><div class="row"><button class="primary" onclick="propose()">Interpret rule</button><button class="smallbutton" onclick="state.nl='If the student answers the simpler counting quiz incorrectly, send them to Counting Foundations.';render()">Example</button></div>${state.proposal?`<div class="drawer"><strong>Proposed structured rule</strong><p class="explain">${esc(human(state.proposal))}</p><div class="two"><div><label>Source</label><select onchange="state.proposal.from=this.value;render()">${resources.map(r=>`<option value="${r.id}" ${state.proposal.from===r.id?'selected':''}>${esc(r.title)}</option>`).join('')}</select></div><div><label>Outcome</label><select onchange="state.proposal.condition=this.value;render()">${['correct','incorrect','completed','always'].map(x=>`<option value="${x}" ${state.proposal.condition===x?'selected':''}>${esc(conditionText(x))}</option>`).join('')}</select></div></div><label>Destination</label><select onchange="state.proposal.to=this.value;render()">${resources.map(r=>`<option value="${r.id}" ${state.proposal.to===r.id?'selected':''}>${esc(r.title)}</option>`).join('')}</select><p class="alert sm">Not applied yet. Review source, condition and destination; natural-language parsing can misunderstand instructions.</p><div class="row"><button class="primary" onclick="acceptProposal()">Accept into draft</button><button onclick="state.proposal=null;render()">Reject</button></div></div>`:''}</div>`}
function workspace(){return `<div class="row between"><div><h2 class="h">Designer + Student Simulator</h2><div class="muted">Select a workflow node, then answer as a simulated student to see the approved branch activate.</div></div><button onclick="studentReset()">Restart simulation</button></div><div class="split" style="margin-top:15px"><div class="stack">${flow()}<div class="card"><div class="row between"><strong>Selected node: ${esc(title(state.node))}</strong><button class="smallbutton" onclick="setPage('rules')">Edit all rules →</button></div>${state.rules.filter(r=>r.from===state.node).map(ruleCard).join('')||'<p class="muted">No outgoing rule for this node.</p>'}<div class="row" style="margin-top:12px"><button onclick="state.nl='After the student completes '+title(state.node)+', send them to the Assertion–Reason quiz.';state.page='rules';render()">＋ Add natural-language rule</button></div></div></div><div class="stack">${student()}<div class="card"><strong>Latest routing decision</strong><div class="debug">${state.trace.length?esc(JSON.stringify(state.trace[state.trace.length-1],null,2)):'No submission yet. The matching edge will highlight when you submit an answer.'}</div></div></div></div>`}
function rulesPage(){let topics=['All topics',...new Set(resources.map(r=>r.topic))];let shown=state.rules.filter(r=>state.ruleTopic==='All topics'||resource(r.from)?.topic===state.ruleTopic);return `<div class="row between"><div><h2 class="h">Rules by topic</h2><div class="muted">Plain-language instructional policies, backed by explicit validated transitions.</div></div><button class="primary" onclick="setPage('workspace')">Open side-by-side simulator</button></div><div class="split" style="margin-top:15px"><div class="stack">${natural()}<div class="card"><div class="row between"><strong>Instructor routing rules</strong><span class="chip">${shown.length} rules</span></div><label>Filter by topic</label><select onchange="state.ruleTopic=this.value;render()">${topics.map(t=>`<option ${state.ruleTopic===t?'selected':''}>${esc(t)}</option>`).join('')}</select>${shown.map(ruleCard).join('')}<div class="row" style="margin-top:15px"><button onclick="resetRules()">Restore example rules</button></div></div></div><div class="stack">${student()}<div class="card"><strong>How the routing works</strong><p class="explain">The system evaluates the submitted activity against the approved assessment. It then matches the result to an instructor rule, records the decision and opens the destination activity. In production, AI may recommend only among policy-eligible paths.</p></div></div></div>`}
function library(){return `<h2 class="h">Resource library</h2><p class="muted">Example quizzes, lessons and topics that can be used as destinations in a workflow rule.</p><div class="gridCards">${resources.map(r=>`<div class="card stack"><span class="chip">${esc(r.type)}</span><strong>${esc(r.title)}</strong><div class="muted">${esc(r.topic)}</div><p>${esc(r.prompt)}</p><button onclick="chooseNode('${r.id}');setPage('workspace')">View in simulator</button></div>`).join('')}</div>`}
function render(){document.getElementById('root').innerHTML=`<div class="shell"><aside class="side"><div class="brand">◈ Math<span>Bank</span><div style="font-size:10px;color:#96a7c2;margin-top:6px;font-weight:500">SOCRATIC STUDIO v3</div></div>${nav()}<small>Human-reviewed workflows<br>Natural-language rule proposals<br>Interactive student simulation</small></aside><section class="main"><header class="top"><div><h1>Adaptive Learning Workflow Studio</h1><div class="muted">Combinatorics / Stars and Bars · Local draft prototype</div></div><div class="row"><span class="chip gold">Demo, not published</span><button onclick="resetRules()">Reset example</button><button class="primary" onclick="setPage('workspace')">Log in as student ↗</button></div></header><main class="content">${state.page==='workspace'?workspace():state.page==='rules'?rulesPage():library()}</main></section></div>`}render();
</script></body></html>
