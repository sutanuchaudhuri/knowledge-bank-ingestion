<!doctype html>
<html>
<head><meta charset="utf-8"><title>Markov Chain Lab</title>
<style>
body{font-family:system-ui,Arial;margin:0;background:#f5f6f8;color:#181818}
header{background:#fff;padding:18px 24px;border-bottom:1px solid #ddd}
main{max-width:1100px;margin:22px auto;padding:0 16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:9px 12px;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}
.tabs button.active{font-weight:700;border-color:#222}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-top:14px}
.row{display:grid;grid-template-columns:210px 1fr 100px;gap:10px;align-items:center;margin:10px 0}
input{width:100%}.formula{font:20px Georgia,serif;background:#fafafa;padding:12px;border-radius:8px;margin:12px 0}
.metric{font-size:17px;margin:10px 0}.small{font-size:13px;color:#555}
table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border:1px solid #ddd;padding:8px;text-align:center}
svg{width:100%;height:330px;border:1px solid #ddd;background:white;border-radius:8px}
</style></head>
<body>
<header><h2>Markov Chain Lab</h2><div class="small">Deterministic pre-authored artifact — state models, hitting probabilities, stationary distributions</div></header>
<main><div class="tabs" id="tabs"></div><div id="content"></div></main>
<script>
const names=["Two-state AMC","Triangle bug","Absorbing frog","Stationary explorer"];
let current=0; const tabs=document.getElementById("tabs"),content=document.getElementById("content");
names.forEach((n,i)=>{let b=document.createElement("button");b.textContent=n;b.onclick=()=>{current=i;render()};tabs.appendChild(b)});
const fmt=x=>Number(x).toFixed(6).replace(/\.?0+$/,"");
function render(){[...tabs.children].forEach((b,i)=>b.className=i===current?"active":"");[two,tri,frog,stationary][current]()}
function two(){
 content.innerHTML=`<div class="card"><h3>AMC 2019 money game: compressed states</h3>
 <div class="formula">A=(1,1,1), B=permutation of (2,1,0)</div>
 <table><tr><th>from \\ to</th><th>A</th><th>B</th></tr><tr><th>A</th><td>1/4</td><td>3/4</td></tr><tr><th>B</th><td>1/4</td><td>3/4</td></tr></table>
 <label>Number of transitions <input id="n" type="range" min="0" max="12" value="1"></label>
 <div id="out" class="metric"></div><div class="small">Notice that after one step the distribution is already invariant.</div></div>`;
 n.oninput=calc;calc();
 function calc(){let k=+n.value,a=1,b=0;for(let t=0;t<k;t++){let na=.25*a+.25*b,nb=.75*a+.75*b;a=na;b=nb;}out.textContent=`after ${k} step(s): P(A)=${fmt(a)}, P(B)=${fmt(b)}`;}
}
function tri(){
 content.innerHTML=`<div class="card"><h3>2003 AIME II #13: triangle bug</h3>
 <div class="formula">pₙ₊₁ = ½(1-pₙ), p₀=1</div>
 <label>n <input id="n" type="range" min="0" max="20" value="10"></label>
 <div id="out" class="metric"></div><div class="small">The fixed point is 1/3; deviations alternate and shrink by factor 1/2.</div></div>`;
 n.oninput=calc;calc();
 function calc(){let k=+n.value,p=1;for(let i=0;i<k;i++)p=.5*(1-p);out.textContent=`p_${k} = ${fmt(p)} ; deviation from 1/3 = ${fmt(p-1/3)}`;}
}
function frog(){
 content.innerHTML=`<div class="card"><h3>2025 AMC 12B #20: absorbing frog</h3>
 <div class="formula">states 0,1,2,3,4,D ; 4=success, D=disappeared</div>
 <table><tr><th>State</th><th>Equation for h(state)</th></tr>
 <tr><td>0</td><td>h₀ = ½ h₁</td></tr>
 <tr><td>1</td><td>h₁ = ¼h₀ + ¼h₂</td></tr>
 <tr><td>2</td><td>h₂ = ¼h₁ + ¼h₃</td></tr>
 <tr><td>3</td><td>h₃ = ¼h₂ + ¼</td></tr>
 <tr><td>4</td><td>h₄ = 1</td></tr><tr><td>D</td><td>h_D = 0</td></tr></table>
 <button onclick="solveFrog()">Solve deterministic linear system</button>
 <div id="out" class="metric"></div></div>`;
}
function solveLinear(A,b){let n=A.length;A=A.map((r,i)=>r.slice().concat([b[i]]));for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];let d=A[c][c];for(let j=c;j<=n;j++)A[c][j]/=d;for(let r=0;r<n;r++){if(r===c)continue;let f=A[r][c];for(let j=c;j<=n;j++)A[r][j]-=f*A[c][j];}}return A.map(r=>r[n])}
function solveFrog(){let A=[[1,-.5,0,0],[-.25,1,-.25,0],[0,-.25,1,-.25],[0,0,-.25,1]],b=[0,0,0,.25];let x=solveLinear(A,b);out.textContent=`h₀=${fmt(x[0])} = 1/97; h₁=${fmt(x[1])}; h₂=${fmt(x[2])}; h₃=${fmt(x[3])}`;}
function stationary(){
 content.innerHTML=`<div class="card"><h3>Two-state stationary explorer</h3>
 <div class="small">P = [[1-a,a],[b,1-b]]</div>
 <div class="row"><label>a = P(A→B)</label><input id="a" type="range" min=".01" max=".99" step=".01" value=".25"><span id="av"></span></div>
 <div class="row"><label>b = P(B→A)</label><input id="b" type="range" min=".01" max=".99" step=".01" value=".5"><span id="bv"></span></div>
 <div id="out" class="metric"></div><div class="formula">π = (b/(a+b), a/(a+b))</div></div>`;
 [a,b].forEach(x=>x.oninput=calc);calc();
 function calc(){let aa=+a.value,bb=+b.value;av.textContent=aa;bv.textContent=bb;out.textContent=`stationary π_A=${fmt(bb/(aa+bb))}, π_B=${fmt(aa/(aa+bb))}`;}
}
render();
</script></body></html>
