<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="50" font-family="Arial" font-size="30" font-weight="bold">Quadratic discriminant</text>
<rect x="60" y="120" width="220" height="70" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="170.0" y="161.0" text-anchor="middle" font-family="Arial" font-size="20">Δ = b² − 4ac</text>
<rect x="390" y="80" width="240" height="70" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="510.0" y="121.0" text-anchor="middle" font-family="Arial" font-size="20">Δ &gt; 0: 2 real</text>
<rect x="390" y="190" width="240" height="70" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="510.0" y="231.0" text-anchor="middle" font-family="Arial" font-size="20">Δ = 0: repeated</text>
<rect x="390" y="300" width="240" height="70" rx="12" fill="#f6f6f8" stroke="#333"/>
<text x="510.0" y="341.0" text-anchor="middle" font-family="Arial" font-size="20">Δ &lt; 0: conjugate pair</text>
<line x1="280" y1="155" x2="390" y2="115" stroke="#333" stroke-width="2"/>
<polygon points="390,115 378,109 378,121" fill="#333"/>
<text x="335.0" y="127.0" text-anchor="middle" font-family="Arial" font-size="16">&gt;0</text>
<line x1="280" y1="155" x2="390" y2="225" stroke="#333" stroke-width="2"/>
<polygon points="390,225 378,219 378,231" fill="#333"/>
<text x="335.0" y="182.0" text-anchor="middle" font-family="Arial" font-size="16">=0</text>
<line x1="280" y1="155" x2="390" y2="335" stroke="#333" stroke-width="2"/>
<polygon points="390,335 378,329 378,341" fill="#333"/>
<text x="335.0" y="237.0" text-anchor="middle" font-family="Arial" font-size="16">&lt;0</text>
</svg>