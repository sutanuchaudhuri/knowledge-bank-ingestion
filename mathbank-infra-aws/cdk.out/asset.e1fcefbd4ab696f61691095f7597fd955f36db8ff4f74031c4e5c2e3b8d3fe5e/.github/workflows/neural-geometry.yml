name: Neural geometry compiler foundation
on:
  push:
    paths: ["mathbank-neural-geometry/**", "mathbank-geometry-engine/**", ".github/workflows/neural-geometry.yml"]
  pull_request:
    paths: ["mathbank-neural-geometry/**", "mathbank-geometry-engine/**", ".github/workflows/neural-geometry.yml"]
permissions:
  contents: read
jobs:
  independent-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./mathbank-geometry-engine -e "./mathbank-neural-geometry[dev]"
      - run: pytest mathbank-neural-geometry/tests -q
      - run: ruff check mathbank-neural-geometry/src mathbank-neural-geometry/tests
      - run: mypy mathbank-neural-geometry/src --ignore-missing-imports
      - run: python -m neural_geometry.cli gallery --output mathbank-neural-geometry/output/gallery
      - uses: actions/upload-artifact@v4
        with:
          name: neural-geometry-foundation-images-and-programs
          path: mathbank-neural-geometry/output/gallery
