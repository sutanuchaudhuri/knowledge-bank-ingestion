[project]
name = "mathbank-manim-studio"
version = "0.1.0"
description = "Standalone research + video-render agents over the SceneSpec contract (requirements/60)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "manim>=0.18",
    "openai>=1.40",
    "fastmcp>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# AWS Lambda-only (requirements/63, mirrors mathbank-rest's own `lambda` extras group) —
# boto3 (S3 object storage) and mangum (ASGI-to-Lambda) are never installed into the
# local dev venv, since local dev always uses the filesystem object-store backend.
lambda = [
    "mangum>=0.17",
    "boto3>=1.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathbank_manim_studio"]
