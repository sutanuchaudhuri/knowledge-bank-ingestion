[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbank"
version = "0.1.0"
description = "Competition math knowledge-bank ingestion pipeline, corpus, and RAG API"
requires-python = ">=3.11"
dependencies = [
  # Google Cloud
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "google-auth-httplib2>=0.2",
  "google-cloud-firestore>=2.16",
  # Data
  "openpyxl>=3.1",
  "PyMuPDF>=1.24",
  "beautifulsoup4>=4.12",
  # Models + validation
  "pydantic>=2.7",
  # Chunking / embeddings
  "tiktoken>=0.7",
  # Utilities
  "PyYAML>=6.0",
  "requests>=2.32",
  "tenacity>=8.3",
  "rich>=13.7",
  # Document parsing — Docling for PDF layout + formula + figure extraction
  "docling>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "pip-audit>=2.7",
]

[project.scripts]
mathbank = "mathbank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
