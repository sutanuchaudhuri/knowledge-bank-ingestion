[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbank-mcp-competitions"
version = "0.1.0"
description = "Standalone FastMCP server exposing MathBank's competition/problem/concept/technique corpus to any MCP-capable agent, plus a Prefab UI competition explorer (requirements/49)."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.1.0",
  "prefab-ui>=0.20.2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "mcp>=1.27",
  "openai>=1.50",
  "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
