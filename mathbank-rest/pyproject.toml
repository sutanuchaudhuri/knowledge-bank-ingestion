[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbank-rest"
version = "0.1.0"
description = "FastAPI service exposing MathBank data; connectivity checks for local Postgres + Neo4j"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "neo4j>=5.23",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "email-validator>=2.1",
  "pymupdf>=1.24",
  "boto3[crt]>=1.35",
  # Real runtime dependency (routers/interaction_templates.py, route_batch.py,
  # route_ollama.py, scene_spec_promotion.py all import it directly) — found misplaced
  # under the `dev` extra while building the Lambda container image (requirements/63),
  # which install only `dependencies`, not `dev`; invisible locally because `make
  # install` always installs `.[dev]` too (mathbank-rest/Makefile).
  "httpx>=0.27",
  "mathbank-geometry-engine>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4",
  "mypy>=1.10",
  # requirement 71: DynamoDB / S3 / SQS store tests run against moto, with no AWS access
  "moto[dynamodb,s3,sqs]>=5.0",
]
# Batch tooling only (requirement 71 §2.5): Bodo auto-parallelises bulk S3 Vectors writes/queries. It brings numba, pyarrow and
# OpenMPI, so it is never part of the Lambda image or `make install`. Bodo patches pandas internals: stay below pandas 2.4.
bulk = [
  "bodo>=2026.10",
  "pandas>=2.2,<2.4",
]
# Only needed inside the Lambda container image (requirements/63); never installed into
# the local dev venv by `make install`, so this has zero effect on local dev/tests.
lambda = [
  "mangum>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathbank_rest = ["practice_profiles.json", "migrations/*.sql"]

[tool.pytest.ini_options]
markers = [
  "ddb_integration: runs against the real `test` data-plane environment (needs MB_DDB_ENV=test and AWS credentials); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# generated by scripts/ddb_models/generate.py (long key-pattern regexes, uniform imports)
"src/mathbank_rest/models/ddb/*.py" = ["E501", "F401"]
"src/mathbank_rest/models/docs/*.py" = ["E501", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
