[project]
name = "mathbank-db"
version = "0.1.0"
description = "Postgres schema + corpus ETL for the MathBank knowledge bank"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# PostgreSQL → DynamoDB / S3 / S3 Vectors migration toolkit (aws/, requirement 70)
aws = [
  "boto3>=1.40",
  "botocore[crt]>=1.40",
  "numpy>=1.26",
  "pyarrow>=15",
]
