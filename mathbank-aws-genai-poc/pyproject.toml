[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbank-aws-genai-poc"
version = "0.1.0"
description = "Proof of concept: live speech-to-speech math tutor (Strands BidiAgent + Amazon Nova Sonic) grounded in MathBank S3 Vectors"
requires-python = ">=3.12"
dependencies = [
  # strands.bidi (BidiAgent + BedrockNovaSonicModel) requires Python 3.12+ and the `bidi` extra.
  "strands-agents[bidi]>=1.64.0,<2",
  # The aws-sutanu-admin profile uses the login_session credential provider, which needs CRT.
  "boto3[crt]>=1.35",
  "openai>=1.50",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathbank_genai_poc = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
